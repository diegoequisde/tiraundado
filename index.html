<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tira un dado</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <main>
        <div class="container">

            <h1 class="titulo-app">Tira un dado</h1>
            <button id="themeToggle" class="theme-toggle">
                <div class="toggle-circle"></div>
            </button>

            <div class="panel-seleccion">
            <select id="selectDado">
                <option value="4">d4</option>
                <option value="6" selected>d6</option>
                <option value="8">d8</option>
                <option value="10">d10</option>
                <option value="12">d12</option>
                <option value="20">d20</option>
            </select>
            <button id="tirar">Tirar</button>
            </div>

            <!-- RESULTADO PRINCIPAL -->
            <div class="panel-resultado">
            <p id="resultado" class="resultado-text">–</p>
            </div>

            <!-- DASHBOARD DE ESTADÍSTICAS -->
            <div class="dashboard">

            <div class="card">
                <h3>Total de tiradas</h3>
                <p id="count" class="valor">0</p>
            </div>

            <div class="card">
                <h3>Más repetido</h3>
                <p id="masRepetido" class="valor">–</p>
            </div>

            <div class="card">
                <h3>Porcentaje de la última cara</h3>
                <p id="porcentaje" class="valor">–</p>
            </div>

            </div>

            <!-- GRÁFICO -->
            <div class="grafico">
            <canvas id="myChart"></canvas>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
